[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build", "dist", ".venv", "Exports"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "DTZ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests may use long lines for readable fixtures and broad asserts.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ty.environment]
extra-paths = ["scripts"]
